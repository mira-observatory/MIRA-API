name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tipos
        run: mypy

      # Las pruebas del validador de SQL no necesitan base de datos ni modelo de
      # lenguaje: corren siempre y son la red de seguridad mas barata del servicio.
      - name: Pruebas
        run: pytest -q
