# Entrada HTTP inicial; configurar dominio y TLS antes de usar el chat publico.
server {
    listen 80;
    server_name 104.131.184.162;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Nginx recibe directamente al cliente. No aceptar una IP elegida por
        # el visitante en sus cabeceras para atribuir auditoria y limites.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";

        # Enviar cada evento SSE de /query/stream sin acumularlo en el proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
