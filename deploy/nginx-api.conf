# Entrada unica de la API: exclusiva del frontend por la VPC.
# Renderizar e instalar con deploy/configure-nginx.sh (ver docs/digitalocean.md).
server {
    listen @@API_PRIVATE_IP@@:8081;
    server_name _;
    allow @@FRONTEND_PRIVATE_IP@@;
    deny all;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Solo el frontend autorizado proporciona la IP del visitante.
        # Su proxy reemplaza estas cabeceras antes de reenviar la solicitud.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";

        # Enviar cada evento SSE de /query/stream sin acumularlo en el proxy.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
