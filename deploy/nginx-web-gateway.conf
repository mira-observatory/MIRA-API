# Acceso exclusivo del frontend por la VPC. No escucha en la IP publica.
# Instalar como /etc/nginx/sites-available/mira-web-gateway.
server {
    listen 10.108.0.4:8081;
    server_name _;
    allow 10.108.0.2;
    deny all;
    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Solo el proxy autorizado puede proporcionar la IP del visitante.
        # Ese proxy reemplaza estos valores, no los concatena con los recibidos.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
